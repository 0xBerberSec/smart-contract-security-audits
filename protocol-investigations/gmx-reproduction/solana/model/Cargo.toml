[package]
name = "gmsol-model"
version = "0.11.0"
edition = "2021"

[features]
default = ["test", "u128"]
test = []
u128 = ["ruint"]
glv = []
strum = ["dep:strum"]
serde = ["dep:serde"]
anchor-lang = []
borsh = []
gmsol-utils = []
js = []
solana = []

[dependencies]
num-traits = "0.2.19"
thiserror = "1.0.69"
ruint = { version = "=1.15.0", optional = true, default-features = false }
rust_decimal = { version = "=1.37.2", default-features = false, features = ["maths"] }
num_enum = "=0.7.4"
typed-builder = "=0.21.2"
strum = { version = "=0.27.1", optional = true, features = ["derive"] }
serde = { version = "=1.0.219", optional = true, features = ["derive"] }

[dev-dependencies]
gmsol-model = { path = ".", features = ["test", "u128"] }
